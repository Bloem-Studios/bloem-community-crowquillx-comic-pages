name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
      - name: Validate
        run: |
          test -z "$(gofmt -l .)"
          test "$(jq -r .version manifest.json)" = "${GITHUB_REF_NAME#v}"
          go test -race -count=1 ./...
          go vet ./...
      - name: Build release binaries
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/plugin-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/plugin-linux-arm64 .
          dist/plugin-linux-amd64 manifest > dist/manifest.json
          go run ./cmd/catalog-index manifest.json dist dist/repository.json
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
      - uses: softprops/action-gh-release@v2
        with:
          body_path: .github/RELEASE.md
          generate_release_notes: true
          files: |
            dist/plugin-*
            dist/checksums.txt
            dist/repository.json
            dist/manifest.json
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
