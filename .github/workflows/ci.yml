name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
      - run: test -z "$(gofmt -l .)"
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: make build
      - run: bin/plugin manifest > /tmp/manifest.json
